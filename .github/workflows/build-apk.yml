# Автосборка: после каждого push в main собирает APK и выкладывает его
# в релиз «latest» — оттуда его можно скачать прямо на телефон.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Подготовка файла
        run: cp app/build/outputs/apk/debug/app-debug.apk alias.apk

      - uses: actions/upload-artifact@v4
        with:
          name: alias-apk
          path: alias.apk

      - name: Публикация в релиз latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest alias.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Последняя сборка #${{ github.run_number }}" \
            --notes "Собрано автоматически из коммита ${{ github.sha }}"
          # Иногда релиз остаётся черновиком — тогда ссылка на скачивание не работает. Публикуем явно.
          for i in 1 2 3 4 5; do
            gh release edit latest --draft=false --prerelease && break
            sleep 5
          done
          test "$(gh release view latest --json isDraft --jq .isDraft)" = "false"
